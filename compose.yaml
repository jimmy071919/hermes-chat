services:
  hermes-chat:
    build: .
    image: hermes-chat:local
    container_name: hermes-chat
    restart: unless-stopped
    # Host network (Linux): reach the Hermes API server / dashboard on the host directly.
    network_mode: host
    # Run as your own user so Hermes (on the host) and this container can share the data folder.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      # Hermes API address + key are read from your Hermes .env (visible through the ~ mount below).
      HERMES_ENV_FILE: ${HERMES_HOME:-${HOME}/.hermes}/.env
      # Same absolute path as on the host, so Hermes can read uploads and write outputs
      # that this container serves for download.
      DATA_DIR: ${DATA_PATH:?set DATA_PATH in .env}
      DOWNLOAD_ROOTS: ${HOME}
    volumes:
      # Read-only: Hermes .env, optional dashboard token file, and files Hermes writes anywhere
      # in your home folder (paths containing a hidden directory are never served).
      - ${HOME}:${HOME}:ro
      - ${DATA_PATH}:${DATA_PATH}
