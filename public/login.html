<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Chat 登入</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form id="login" class="login-card">
    <div class="logo">☤</div>
    <h1>Hermes Chat</h1>
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autofocus required>
    <button type="submit">登入</button>
    <p id="err" class="err"></p>
  </form>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (r.ok) location.href = '/';
      else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error?.message || '登入失敗';
    });
  </script>
</body>
</html>
